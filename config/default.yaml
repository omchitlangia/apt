# Algorithmic Pairs Trading — default configuration
# All paths are relative to the project root unless otherwise noted.

paths:
  raw_data_dir: /Data6/db           # read-only source CSVs
  interim_dir: data/interim          # raw-as-parquet, intermediate outputs
  processed_dir: data/processed      # adjusted, cleaned, analysis-ready
  pairs_dir: data/pairs              # pair-level outputs (spreads, z-scores)
  plots_dir: plots                   # all PNGs, organised by phase
  reports_dir: reports               # human-readable CSVs and summaries
  logs_dir: logs                     # loguru output files

universe:
  # 756 ≈ 3 trading years; filters out newly listed / thinly traded names
  min_history_days: 756

liquidity:
  # 60-day rolling-median ADV (close * volume) floor, in INR.
  # 1 crore (₹10,000,000) is a conservative starting point — names below
  # this are typically too thin for pairs trading.
  min_adv_inr: 10000000
  rolling_window: 60
  rolling_min_periods: 20

cleaning:
  # Phantom-seam detection threshold for trim_phantom_history (Rule 3).
  phantom_jump_threshold: 0.65
  # Validation-gate threshold for the post-clean discontinuity scan.
  validation_jump_threshold: 0.40
  # Start of the validation re-scan window (full lookback).
  validation_start: 2011-01-01
  # Rule 7 (contiguity): gaps > this many calendar days split a symbol
  # into segments; only the longest is kept. Normal NSE holiday clusters
  # are < 7 days; 10 leaves headroom for the occasional long weekend.
  contiguity_max_gap_days: 10
  # Segments overlapping >= this date win over segments that don't (so a
  # short backtest-relevant segment beats a long pre-backtest one).
  contiguity_prefer_overlap_after: 2015-01-01

screening:
  # LOCKED at 0.50 (Day 6). Sweep at 0.85 → 2 degenerate pairs (DVR + holdco);
  # 0.50 yields ~hundreds of candidates, leaving the FDR-corrected cointegration
  # stage room to make multiple-comparison inflation visible.
  correlation_threshold: 0.50
  # Number of recent trading days used for correlation estimation (~2 years)
  n_corr_days: 504
  # Pairs with fewer overlapping observations are discarded before cointegration
  min_overlap_days: 504

cointegration:
  # Standard 5 % significance level for ADF rejection of unit root
  significance_level: 0.05
  # Raw ADF p-value cutoff (also used for the cross-window stability check)
  max_pvalue: 0.05
  # Benjamini-Hochberg false-discovery rate (Day 6 multiple-comparisons correction)
  fdr_alpha: 0.05
  # Training window for fold-aware EG selection (~4 trading years)
  n_train_days: 1008
  # Hard minimum train length (~3 trading years); below this a fold is skipped
  min_train_days: 756
  # Tradeable mean-reversion band (in trading days) — half-life outside this
  # interval is either noise (faster) or capital-inefficient (slower).
  half_life_min_days: 5
  half_life_max_days: 60
  # Hurst exponent must be < hurst_max for the spread to be considered mean-reverting
  hurst_max: 0.5
  # Max lag (in trading days) used in the variance-of-differences Hurst estimator
  hurst_max_lag: 100

spread:
  # 60 ≈ 3 trading months. Trailing rolling window for the causal z-score
  # in apt.signals.spread.rolling_zscore. Shorter than the train window so
  # the z adapts to mild drift; long enough that the std is well-estimated.
  rolling_window: 60

signal:
  # Default thresholds for apt.signals.spread.generate_signals. TUNABLE, but
  # any tuning happens per-fold on TRAINING windows only — never grid-searched
  # on the full sample.
  entry_z: 2.0
  exit_z: 0.5
  stop_z: 3.5
  # Per-pair max_holding = min(max_holding_cap_days,
  #                            half_life_multiplier * pair.half_life)
  # The cap keeps capital from being stuck in a slow-mean-reverter for months.
  max_holding_cap_days: 60
  max_holding_half_life_multiplier: 3.0

backtest:
  # Phase 2A walk-forward. Folds = [prior 1008d][train 1008d][test 252d];
  # rolled forward annually. The 252-day test gives ~1 trading year of OOS
  # P&L per fold, ~8 folds across the full Nifty-500 history.
  test_days_per_fold: 252
  step_days: 252
  # Round-trip transaction cost per leg, in basis points. Default = 25 bps
  # is a realistic mid-range Indian-equity figure (brokerage + STT + slippage).
  # Two legs per pair trade ⇒ 2× this per round trip in cost-log space.
  cost_bps_per_leg: 25.0

risk_managed:
  # Phase 2B ablation-ladder defaults. STRATEGY_SPEC.md §3.
  # §3.2 fixed-fractional sizing: notional = risk_frac * C / stop_distance,
  # where stop_distance = (z_stop − z_entry) * rolling_sigma_at_entry.
  risk_frac: 0.01
  # §3.3 per-pair notional cap
  per_pair_cap: 0.12
  # §3.4 cluster (sector) risk cap
  cluster_cap: 0.05
  # §3.6 total open-risk cap (gross book limit in capital fraction)
  total_cap: 0.10
  # §3.6 hard gross-leverage ceiling (sum |w_i| ≤ this multiple of capital)
  gross_cap: 2.0
  # §3.7 pair-kill switch — RELATIONSHIP-driven primary trigger; loss-count
  # backstop loose at K=4 (NOT 2) so a normal losing streak on a still-
  # cointegrating pair does not bench it.
  kill_K: 4
  kill_cap: 0.04
  # Relationship-breakdown re-test cadence (trading days) and window:
  kill_check_interval_days: 21
  kill_relationship_window_days: 252
  kill_relationship_adf_alpha: 0.05
  kill_relationship_halflife_max_days: 60
  kill_relationship_vol_ratio_max: 2.0

parallel:
  # -1 = use all available cores; set to a positive integer to limit
  n_jobs: -1
