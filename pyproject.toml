[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apt"
version = "0.1.0"
description = "Algorithmic Pairs Trading — NSE universe"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.36",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyYAML>=6.0.1",
    "loguru>=0.7.2",
    "joblib>=1.3.2",
    "tqdm>=4.66.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "urllib3>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.9",
    "pre-commit>=3.6.0",
    "ipykernel>=6.27.0",
]
rl = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
    "torch>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
    "N803",  # argument name should be lowercase (statsmodels uses X)
    "N806",  # variable in function should be lowercase (same reason)
    "N999",  # numbered script filenames (01_ingest_daily, etc.) are not importable modules
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["apt"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/apt"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
